name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      ADSB_AUTO_START: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev librtlsdr-dev libusb-1.0-0-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run CI
        run: bin/ci

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rspec-results
          path: tmp/rspec_results.xml
